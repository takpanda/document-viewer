services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data/uploads_data:/app/uploads
      - ./data/skills_data:/app/skills
    environment:
      - FLASK_ENV=production
      - UPLOAD_DIR=/app/uploads
      - SKILLS_DIR=/app/skills
      - MAX_UPLOAD_SIZE=52428800
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  mcp:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - ./data/uploads_data:/app/uploads
      - ./data/skills_data:/app/skills
    environment:
      - UPLOAD_DIR=/app/uploads
      - SKILLS_DIR=/app/skills
      - MCP_PORT=8081
    restart: unless-stopped
    command: ["python", "mcp_server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "http://localhost:8081/mcp"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  e2e:
    image: node:18-bullseye
    working_dir: /workspace
    volumes:
      - .:/workspace
    # this service is intended for developers to run Playwright CLI tests
    command: /bin/sh -c "npm install && npm run e2e"
    depends_on:
      - app
    # not exposed on any port, runs on demand

volumes:
  uploads_data:
  skills_data:
