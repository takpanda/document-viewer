services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - FLASK_ENV=production
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE=52428800
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  uploads_data:
