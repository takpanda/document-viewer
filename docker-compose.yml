services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data/uploads_data:/app/uploads
      - ./data/skills_data:/app/skills
    environment:
      - FLASK_ENV=production
      - UPLOAD_DIR=/app/uploads
      - SKILLS_DIR=/app/skills
      - MAX_UPLOAD_SIZE=52428800
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  mcp:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - ./data/uploads_data:/app/uploads
      - ./data/skills_data:/app/skills
    environment:
      - UPLOAD_DIR=/app/uploads
      - SKILLS_DIR=/app/skills
      - MCP_PORT=8081
    restart: unless-stopped
    command: ["python", "mcp_server.py"]
    healthcheck:
      # FastMCP's Streamable HTTP endpoint requires an Accept header that includes
      # both application/json and text/event-stream, and a valid JSON-RPC request.
      test:
        [
          "CMD-SHELL",
          "printf '%s' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1.0\"}}}' | curl -fsS -X POST http://localhost:8081/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data-binary @- >/dev/null"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  e2e:
    image: node:18-bullseye
    working_dir: /workspace
    volumes:
      - .:/workspace
    # this service is intended for developers to run Playwright CLI tests
    command: /bin/sh -c "npm install && npm run e2e"
    depends_on:
      - app
    # not exposed on any port, runs on demand

volumes:
  uploads_data:
  skills_data:
