<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Viewer</title>

  <!-- Tailwind CSS (local) -->
  <link rel="stylesheet" href="/static/vendor/tailwind.min.css" />

  <!-- Highlight.js (GitHub theme, local) -->
  <link rel="stylesheet" href="/static/vendor/github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="/static/vendor/github-dark.min.css" id="hljs-dark" disabled />
  <script src="/static/vendor/highlight.min.js"></script>

  <!-- marked.js (local) -->
  <script src="/static/vendor/marked.min.js"></script>

  <!-- mermaid.js (local) -->
  <script src="/static/vendor/mermaid.min.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="/static/css/style.css?v=2" />
</head>

<body class="h-full bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100 overflow-hidden">

  <!-- ===== Header ===== -->
  <header class="flex items-center justify-between h-14 px-4 border-b border-border dark:border-border-dark bg-sidebar dark:bg-sidebar-dark shrink-0">
    <div class="flex items-center gap-3">
      <!-- Hamburger (mobile) -->
      <button id="btn-sidebar-toggle" class="md:hidden p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700" aria-label="Toggle sidebar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
      </button>

      <!-- Tab switcher -->
      <div class="flex items-center gap-1 p-0.5 rounded-lg bg-gray-100 dark:bg-gray-800">
        <button id="tab-docs" class="tab-btn tab-active flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-150">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
          ドキュメント
        </button>
        <button id="tab-skills" class="tab-btn flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-150">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"/></svg>
          スキル
        </button>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Upload button (documents mode) -->
      <button id="btn-upload" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-md border border-border dark:border-border-dark bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
        フォルダ選択
      </button>

      <!-- Upload skill button (skills mode) -->
      <button id="btn-upload-skill" class="hidden inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-md text-white transition-colors"
              style="background:#3b82f6">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/></svg>
        スキルを共有
      </button>
      <input type="file" id="skill-folder-input" webkitdirectory directory multiple class="hidden" />

      <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden" />

      <!-- Dark mode toggle -->
      <button id="btn-theme" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" aria-label="Toggle dark mode">
        <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
        <svg id="icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Main layout ===== -->
  <div class="flex h-[calc(100vh-3.5rem)] overflow-hidden">

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-20 hidden md:hidden"></div>

    <!-- Left pane – file tree -->
    <aside id="sidebar" class="w-72 shrink-0 border-r border-border dark:border-border-dark bg-sidebar dark:bg-sidebar-dark flex flex-col z-30 transition-transform duration-200 max-md:fixed max-md:inset-y-14 max-md:left-0 max-md:h-[calc(100vh-3.5rem)] max-md:-translate-x-full max-md:shadow-xl" data-open="false">

      <!-- === Documents panel === -->
      <div id="panel-docs" class="flex flex-col flex-1 min-h-0">
        <!-- Tree root -->
        <div id="file-tree" class="flex-1 overflow-y-auto py-2 text-sm">
          <!-- Empty state -->
          <div id="tree-empty" class="flex flex-col items-center justify-center gap-3 px-4 py-12 text-gray-400 dark:text-gray-500">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
            <p class="text-center text-xs leading-relaxed">下のボタンでフォルダを作成するか<br/>「フォルダ選択」ボタンで<br/>ドキュメントをアップロード</p>
          </div>
        </div>

        <!-- Sidebar footer – New Folder button -->
        <div class="shrink-0 border-t border-border dark:border-border-dark px-3 py-2 bg-sidebar dark:bg-sidebar-dark">
          <button id="btn-new-root-folder" class="w-full inline-flex items-center justify-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-md border border-border dark:border-border-dark bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
            ＋ フォルダ作成
          </button>
        </div>
      </div>

      <!-- === Skills panel === -->
      <div id="panel-skills" class="hidden flex flex-col flex-1 min-h-0">
        <!-- Search -->
        <div class="px-3 pt-3 pb-2">
          <div class="relative">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
            </div>
            <input id="skills-search" type="text" placeholder="スキルを検索..." class="w-full text-xs rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 py-2 pl-9 pr-3 focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-400 transition-all" />
          </div>
        </div>

        <!-- Skills list -->
        <div id="skills-list" class="flex-1 overflow-y-auto py-1 text-sm">
          <div id="skills-empty" class="flex flex-col items-center justify-center gap-3 px-4 py-12 text-gray-400 dark:text-gray-500">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z"/></svg>
            <p class="text-center text-xs leading-relaxed">共有されたスキルはまだありません<br/>「スキルを共有」ボタンで<br/>スキルをアップロード</p>
          </div>
        </div>
      </div>

    </aside>

    <!-- Resize handle -->
    <div id="resize-handle" class="w-1 cursor-col-resize hover:bg-blue-400/40 active:bg-blue-500/50 transition-colors hidden md:block shrink-0"></div>

    <!-- Right pane – preview -->
    <main id="preview-pane" class="flex-1 overflow-y-auto">
      <!-- Upload progress -->
      <div id="upload-progress" class="hidden px-6 py-3">
        <div class="flex items-center gap-3 text-sm text-gray-600 dark:text-gray-400">
          <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
          <span id="upload-status">アップロード中...</span>
        </div>
        <div class="mt-2 h-1.5 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
          <div id="upload-bar" class="h-full bg-blue-500 rounded-full transition-all duration-300" style="width:0%"></div>
        </div>
      </div>

      <!-- File path breadcrumb -->
      <div id="breadcrumb" class="hidden sticky top-0 z-10 px-6 md:px-10 py-2 text-xs text-gray-500 dark:text-gray-400 bg-white/80 dark:bg-gray-950/80 backdrop-blur border-b border-border dark:border-border-dark">
      </div>

      <!-- Welcome state -->
      <div id="preview-welcome" class="flex flex-col items-center justify-center h-full text-gray-400 dark:text-gray-500 select-none">
        <svg class="w-20 h-20 mb-4" fill="none" stroke="currentColor" stroke-width="0.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
        <p class="text-lg font-medium mb-1">Markdown Document Viewer</p>
        <p class="text-sm">左のツリーからファイルを選択してプレビュー</p>
      </div>

      <!-- Markdown content -->
      <article id="preview-content" class="hidden markdown-body max-w-4xl mx-auto px-6 md:px-10 py-8">
      </article>

      <!-- Skill detail pane -->
      <div id="skill-detail-pane" class="hidden overflow-y-auto">
      </div>
    </main>
  </div>

  <!-- Debug: Verify libraries loaded -->
  <script>
    console.log('[DocViewer] marked:', typeof marked, marked && typeof marked.parse);
    console.log('[DocViewer] mermaid:', typeof mermaid, mermaid && typeof mermaid.initialize);
    console.log('[DocViewer] hljs:', typeof hljs, hljs && typeof hljs.highlight);
  </script>

  <!-- Hidden file input for upload-to-folder -->
  <input type="file" id="file-upload-input" multiple class="hidden" />

  <!-- ===== Context Menu ===== -->
  <div id="ctx-menu" class="hidden fixed min-w-[180px] py-1 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm text-gray-700 dark:text-gray-200 select-none" style="z-index:9999">
    <button id="ctx-new-folder" class="ctx-item w-full flex items-center gap-2 px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-left">
      <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
      新規フォルダ
    </button>
    <button id="ctx-upload-files" class="ctx-item w-full flex items-center gap-2 px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-left">
      <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
      ファイルをアップロード
    </button>
    <button id="ctx-rename" class="ctx-item w-full flex items-center gap-2 px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-left">
      <svg class="w-4 h-4 text-yellow-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125"/></svg>
      名前を変更
    </button>
    <div class="border-t border-gray-200 dark:border-gray-700 my-1"></div>
    <button id="ctx-delete" class="ctx-item w-full flex items-center gap-2 px-3 py-1.5 hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 dark:text-red-400 transition-colors text-left">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
      削除
    </button>
  </div>

  <!-- ===== Delete Confirmation Dialog ===== -->
  <div id="delete-dialog" class="hidden fixed inset-0 flex items-center justify-center" style="z-index:10000">
    <div class="dialog-overlay absolute inset-0 bg-black/40 backdrop-blur" style="background:rgba(0,0,0,0.5)"></div>
    <div class="dialog-card relative overflow-hidden" style="width:100%;max-width:380px;margin:0 1rem;border-radius:1rem;background:rgba(255,255,255,0.97);box-shadow:0 25px 60px -12px rgba(0,0,0,0.25),0 0 0 1px rgba(0,0,0,0.05)">
      <!-- Danger gradient top bar -->
      <div class="h-1.5" style="background:linear-gradient(90deg,#ef4444,#f97316,#ef4444)"></div>
      <!-- Body -->
      <div class="px-6 text-center" style="padding-top:1.5rem;padding-bottom:1rem">
        <div class="mx-auto flex items-center justify-center mb-4" style="width:3.5rem;height:3.5rem;border-radius:1rem;background:linear-gradient(135deg,#fef2f2,#fee2e2);box-shadow:0 4px 12px rgba(239,68,68,0.15)">
          <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
        </div>
        <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-1">削除の確認</h3>
        <p id="delete-dialog-msg" class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed"></p>
      </div>
      <!-- Path chip -->
      <div class="flex items-center gap-2" style="margin:0 1.5rem 1.25rem;padding:0.625rem 0.75rem;border-radius:0.75rem;background:rgba(0,0,0,0.03)">
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
        <p id="delete-dialog-path-text" class="text-xs text-gray-600 dark:text-gray-300 truncate" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></p>
      </div>
      <!-- Actions -->
      <div class="flex gap-3 px-6" style="padding-bottom:1.5rem">
        <button id="delete-dialog-cancel" class="flex-1 px-4 text-sm font-semibold text-gray-700 dark:text-gray-300 transition-all duration-150 hover:bg-gray-100 dark:hover:bg-gray-700" style="padding-top:0.625rem;padding-bottom:0.625rem;border-radius:0.75rem;background:rgba(0,0,0,0.04)">キャンセル</button>
        <button id="delete-dialog-confirm" class="flex-1 px-4 text-sm font-semibold text-white transition-all duration-150" style="padding-top:0.625rem;padding-bottom:0.625rem;border-radius:0.75rem;background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(239,68,68,0.35)">削除する</button>
      </div>
    </div>
  </div>

  <!-- ===== Folder Name Dialog ===== -->
  <div id="folder-dialog" class="hidden fixed inset-0 flex items-center justify-center" style="z-index:10000">
    <div class="dialog-overlay absolute inset-0 bg-black/40 backdrop-blur" style="background:rgba(0,0,0,0.5)"></div>
    <div class="dialog-card relative overflow-hidden" style="width:100%;max-width:380px;margin:0 1rem;border-radius:1rem;background:rgba(255,255,255,0.97);box-shadow:0 25px 60px -12px rgba(0,0,0,0.25),0 0 0 1px rgba(0,0,0,0.05)">
      <!-- Blue gradient top bar -->
      <div class="h-1.5" style="background:linear-gradient(90deg,#3b82f6,#8b5cf6,#3b82f6)"></div>
      <!-- Body -->
      <div class="px-6 text-center" style="padding-top:1.5rem;padding-bottom:0.5rem">
        <div class="mx-auto flex items-center justify-center mb-4" style="width:3.5rem;height:3.5rem;border-radius:1rem;background:linear-gradient(135deg,#eff6ff,#dbeafe);box-shadow:0 4px 12px rgba(59,130,246,0.15)">
